minimumReleaseAge: 10080

packages:
  - packages/*

allowBuilds:
  '@nestjs/core': true
  '@parcel/watcher': true
  bufferutil: true
  esbuild: true
  msgpackr-extract: true
  sharp: true
  utf-8-validate: true
  v-code-diff: true
  vue-demi: true

overrides:
  "@babel/parser": "7.29.12"
  # https://github.com/babel/babel/pull/18588
  # `7.29.12`→`7.29.13`でデグレ
  # `7.29.14`でデグレ解消済み
  # minimumReleaseAgeの消化待ち
